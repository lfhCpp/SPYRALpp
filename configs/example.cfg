# RK4 示例配置：12Be(p,p) 弹性散射，H2 靶 600 Torr
# 用法：build/rk4_simulate configs/example.cfg /tmp/clouds.root 100

[run]
seed = 7
n_events = 100

[gas]
A = 1
Z = 1
stoich = 2
pressure_torr = 600

[reaction]
beam_A = 12
beam_Z = 4
target_A = 1
target_Z = 1
ejectile_A = 1
ejectile_Z = 1

[beam]
ke_mev = 40
ex_centroid = 0
ex_fwhm = 0
theta_min = 50
theta_max = 110

[vertex]
z_min = 0.05
z_max = 0.45
rho_sigma = 0.005

[detector]
mode = ejectile
bfield_t = 2.85
efield_vm = 55000
clock_mhz = 3.125          # 与 Run 0151 的 320 ns/TB 波形配置一致

[solver]
# 拟合后端：minuit（TMinuit + 轨迹网格插值，默认）| kalman（UKF + RTS 平滑）
fitter = minuit
# Keep Minuit's local nearest-segment candidate set distance-sorted.
minuit_sort_candidates = true
# Experimental periodic azimuth bounds are opt-in.
minuit_centered_azimuth_bounds = false
# Detector fields above are positive magnitudes. Spyral 1.0 propagates with
# -B and -E; use the same convention in the Kalman backend.
kalman_bfield_sign = -1
kalman_efield_vm = 55000
kalman_efield_sign = -1
# Kalman 后端参数（fitter = kalman 时生效）
kalman_meas_sigma = 0.5       # 量测点位置 sigma，mm
kalman_per_cluster_covariance = 0 # ATTPCROOT簇级pad/diffusion协方差（默认固定sigma）
kalman_cluster_coef_t = 9e-5  # 横向扩散系数，cm^2/us
kalman_cluster_coef_l = 9e-7  # 纵向扩散系数，cm^2/us
kalman_cluster_drift_velocity = 1.0 # 漂移速度，cm/us
kalman_cluster_tb_time = 0.320 # 时间桶宽度，us
kalman_cluster_pad_resolution_xy = 2.3 # pad XY分辨率，mm
kalman_mom_sigma_frac = 0.1   # 动量先验相对不确定度
kalman_pos_sigma = 0.5        # 位置先验 sigma，mm
kalman_ang_sigma = 1          # 角度先验 sigma，度
kalman_min_clusters = 10      # 最少量测点数（a1954 Be12）
kalman_smooth = 1             # RTS 平滑
kalman_straggling = 0         # 能损 straggling 过程噪声
kalman_mult_scattering = 0    # Highland 多重散射过程噪声
kalman_rad_length_mm = 7.6e6  # 多重散射用的辐射长度
kalman_alpha = 0.001          # UKF sigma 点参数（ATTPCROOT）
kalman_beta = 2
kalman_kappa = 0
kalman_iterations = 1          # >1 enables an ATTPCROOT-style smoothed-reference re-pass
kalman_ref_covariance_inflation = 4.0
kalman_z_pad_plane_mm = 0  # digi-to-lab z transform; set 1000 for a1954 Be12
kalman_back_extrap = 1        # 反推到束流轴求顶点
kalman_back_extrap_max = 50   # 反推最大路径，mm
kalman_chi2_max = 0           # >0 时 χ²/ndf 超限判失败
kalman_step_mm = 0.1          # RK4 传播步长，mm（ATTPCROOT 默认）
A = 1
Z = 1
ke_bins = 256
# Match the experimentally validated production energy mesh for proton fits.
ke_min = 0.1
ke_max = 70
polar_bins = 129
polar_min = 2
polar_max = 88
n_time = 400
dt = 3e-10                 # 轨迹网格时间步长（秒），默认 0.3 ns；覆盖约 120 ns

[peaks]
# 峰参数估计：0 = 局部极大 + 突出度（快）；1 = GET 电子学响应模板拟合（含饱和修复）
template_fit = 0
sampling_ns = 320        # 采样周期，ns（Run 0151: 3.125 MHz）
peaking_ns = 2000        # 成形/峰化时间，ns
sat_adc = 4095           # ADC 削顶电平（12-bit）
max_peaks = 12           # 单条迹最多拟几个峰（长波形会被拆成多个）
residual_threshold = 40  # 残差峰幅度阈值（ADC）

[pid]
# 拟合前的 PID 预筛：用粗估的 (Bρ, dE/dx) 先判粒子，挡住明显不是目标粒子的簇
gate = 0
min_sep = 0.3            # 对数似然间隔阈值，越大越严
require = -1             # 只保留某个候选（-1 = 不限定；0=p 1=d 2=t 3=3He 4=alpha）
